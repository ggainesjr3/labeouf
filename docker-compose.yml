services:
  db:
    image: postgres:15-alpine
    # Must bind 0.0.0.0 (not 127.0.0.1) if backend uses db — that resolves to docker0, not loopback.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: gary_admin
      POSTGRES_PASSWORD: [REDACTED]
      POSTGRES_DB: labeouf_vault
      TZ: America/New_York
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gary_admin -d labeouf_vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    extra_hosts:
      - "db:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Use host loopback when container-to-container bridge traffic is blocked (iptables/Tailscale).
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: gary_admin
      DATABASE_PASSWORD: [REDACTED]
      DATABASE_NAME: labeouf_vault
      TZ: America/New_York
      WEBHOOK_URL: ""
      ALLOWED_ORIGIN: http://localhost
      JWT_SECRET: [REDACTED]
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: http://localhost:3001/auth/google/callback
      OPENAI_API_KEY: ""
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      TYPEORM_SYNCHRONIZE: "true"
      TYPEORM_MIGRATIONS_RUN: "false"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
